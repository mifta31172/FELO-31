<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FELO 31 · F-31 Student Companion</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self' https://*.github.io; connect-src 'self' https://*.github.io https://api.github.com https://*.workers.dev; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<meta name="theme-color" content="#eef3ec">

<style>
:root{--bg:#eef3ec;--bgimg:linear-gradient(180deg,#e6efe4,#f3f7f0);--cd:#f9fbf6;--cd2:#f1f5ee;--tx:#1f2a24;--mu:#5d6b62;--ac:#2f7d5b;--as:#dcebdf;--bd:#d8e4d8;--on:#fbfdf9;--g1:#2f7d5b;--g2:#5fa682;--sh:0 1px 2px rgba(31,42,36,.05),0 8px 22px rgba(31,42,36,.06);--fs:15px;--rad:18px;--pad:14px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{margin:0}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bgimg,var(--bg));background-color:var(--bg);background-attachment:fixed;color:var(--tx);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Hind Siliguri",sans-serif;-webkit-text-size-adjust:100%;transition:background-color .4s}
header,main,.chips{max-width:640px;margin-left:auto;margin-right:auto}
header{padding:12px 16px 2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#clk{font-size:.8em;font-weight:600;color:var(--ac)}
.brand{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
.brand svg{width:46px;height:46px;border-radius:14px;flex:none;box-shadow:var(--sh)}
h1{margin:0;font-size:1.5em;line-height:1.1;letter-spacing:.04em;font-weight:900;background:linear-gradient(90deg,var(--g1),var(--g2) 70%,#d9a441);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--mu);font-size:.82em;font-weight:600;letter-spacing:.02em}
main{padding:4px 16px 108px}
.chips{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:44px;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-weight:600;font-size:.93em;font-family:inherit;transition:transform .15s}
.chip:active{transform:scale(.95)}
.chip small{display:block;font-weight:400;color:var(--mu);font-size:.75em}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--on)}.chip.on small{color:var(--on)}
.sec{margin:24px 4px 8px;color:var(--mu);font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--bd)}
.card{background:var(--cd);border-radius:var(--rad);padding:var(--pad) 16px;margin:10px 0;display:flex;flex-direction:column;gap:5px;box-shadow:var(--sh);border:1px solid var(--bd)}
.card b{font-size:1.07em}.card span,.card small,.rt span{color:var(--mu)}.card small{font-size:.83em}.card p{margin:4px 0 0;white-space:pre-wrap}
.fade>.card,.fade>.list,.fade>details{animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hello{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);border:0;position:relative;overflow:hidden}
.hello::after{content:"✚";position:absolute;right:-6px;top:-18px;font-size:92px;opacity:.1;color:#fff}
.hello b{font-size:1.2em}.hello span,.hello small{color:var(--on);opacity:.92}
.hello .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tg{font-size:.75em;font-weight:700;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.2);color:var(--on)}
.hero{background:var(--as)}
.pin{border-left:4px solid var(--ac)}
.live{border:1.5px solid #d96a6e}
.lv{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d96a6e;margin-right:6px;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25}}
.bar{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:4px;transition:width .6s}
.tt{display:flex;gap:12px;align-items:center}
.list{background:var(--cd);border-radius:var(--rad);overflow:hidden;box-shadow:var(--sh);margin:8px 0;border:1px solid var(--bd)}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--bd)}.row:last-child{border-bottom:0}
.row.on{background:var(--as)}.row.off{opacity:.55}.row.past{opacity:.5}
.ic{width:38px;height:38px;border-radius:12px;background:var(--as);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.st{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 3px 8px -2px var(--c2)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column}.rt b{font-size:1em}.rt span{font-size:.85em}
.tm{font-size:.85em;color:var(--mu);white-space:nowrap;text-align:right}
.pill{font-size:.73em;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--ac);color:var(--on);flex:none}.pill.ok{background:var(--as);color:var(--ac)}
details{background:var(--cd);border-radius:var(--rad);box-shadow:var(--sh);margin:10px 0;overflow:hidden;border:1px solid var(--bd)}
summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:600;display:flex;align-items:center;gap:10px}
summary.row{padding:11px 14px;border:0}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';margin-left:auto;color:var(--mu);font-size:22px;line-height:1;transition:transform .2s}
details[open]>summary::after{transform:rotate(90deg)}
details .inner{padding:0 14px 14px}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:2px 12px 12px}
.dy{padding:8px 4px;border-radius:10px;background:var(--cd2);font-size:.85em;text-align:center}.dy small{color:var(--mu)}
.dy.on{background:var(--ac);color:var(--on)}.dy.past{opacity:.55}.dy.fr{opacity:.4}
a{color:var(--ac);font-weight:600}
input,textarea,select{font:inherit;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--cd2);color:var(--tx);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.act{font:inherit;font-weight:700;padding:12px 14px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);width:100%;transition:transform .15s}
.act:active{transform:scale(.98)}
.link{background:none;border:1px solid var(--bd);border-radius:14px;padding:5px 12px;color:var(--mu);font-family:inherit;font-size:.85em}
.card .link{align-self:flex-start;margin-top:4px}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--cd2);color:var(--tx);font:inherit;margin-top:8px}
.opt.right{background:#d5ecd9;border-color:#6fb67d;color:#173d22}.opt.wrong{background:#f4d9d6;border-color:#d98880;color:#5c1f1a}.opt.dim{opacity:.55}
.res{border-radius:12px;padding:10px 12px;margin-top:10px;display:flex;flex-direction:column;gap:4px}.res.good{background:#d5ecd9;color:#173d22}.res.bad{background:#f8e7d2;color:#5f3411}
.res span,.res small{color:inherit}
.hint{color:var(--mu);font-size:.83em;margin:4px 4px 0;display:block}
.bigl svg{width:78px;height:78px;border-radius:22px;box-shadow:var(--sh)}
footer{margin:30px 0 0;text-align:center;color:var(--mu);font-size:.8em;line-height:1.7}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;max-width:128px;padding:8px 0 9px;background:none;border:0;color:var(--mu);font-size:.73em;font-weight:700;font-family:inherit;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button.on{color:var(--ac)}nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--ac)}
.dot{position:absolute;top:6px;margin-left:16px;width:8px;height:8px;border-radius:50%;background:#d9534f}
.si{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.si.mini{width:15px;height:15px;vertical-align:-2px}.si.nv{width:23px;height:23px}
.ic{color:var(--c,var(--ac))}.ic.fl{font-size:20px}
.t-lecture{--c:#3f6fbf;background:rgba(63,111,191,.13)}.t-ward{--c:#2f8a68;background:rgba(47,138,104,.13)}.t-sgt{--c:#7a55c4;background:rgba(122,85,196,.13)}.t-tutorial{--c:#c27a1d;background:rgba(194,122,29,.14)}.t-practical{--c:#16928a;background:rgba(22,146,138,.14)}.t-seminar{--c:#5a58c4;background:rgba(90,88,196,.13)}.t-case{--c:#c4457f;background:rgba(196,69,127,.13)}.t-integrated{--c:#2b87b8;background:rgba(43,135,184,.13)}.t-exam{--c:#c9484a;background:rgba(201,72,74,.13)}.t-lunch,.t-break{--c:#85796f;background:rgba(133,121,111,.16)}.t-sun{--c:#d9741e;background:rgba(217,116,30,.14)}.t-moon{--c:#4f49b6;background:rgba(79,73,182,.14)}.t-ban{--c:#c9484a;background:rgba(201,72,74,.14)}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill.red{background:#c9484a;color:#fff}.pill.new{background:#d6456b;color:#fff}
.row.canc .rt b{text-decoration:line-through;opacity:.7}.row.canc{background:rgba(201,72,74,.07)}.cancc{border:1.5px solid #c9484a}
.cat{align-self:flex-start;font-size:.73em;font-weight:700;padding:2px 9px;border-radius:10px;color:var(--cc);background:var(--cd2);border:1px solid var(--cc)}
.nh{display:flex;gap:6px;align-items:center}.nb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.nb .link{margin:0!important}.dng{color:#c9484a!important;border-color:#c9484a!important}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:var(--rad);border:1px solid var(--bd);background:var(--cd);box-shadow:var(--sh);color:var(--tx);font:inherit;text-align:left;position:relative;overflow:hidden}.tile .ti{font-size:26px;line-height:1}.tile b{font-size:1em}.tile small{color:var(--mu);font-size:.78em;margin-top:-4px}
.sh{display:flex;align-items:center;gap:10px;margin:8px 0}.sh b{font-size:1.15em}
.gl{display:flex;align-items:center;gap:10px;padding:6px 0}.gl span:nth-child(2){flex:1}.gk{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:none}.gk.ok{background:var(--ac);border-color:var(--ac);color:var(--on)}.gk .si{width:13px;height:13px;stroke-width:3}
.cbx{display:flex;gap:10px;align-items:flex-start;padding:7px 0}.cbx input{width:20px;height:20px;flex:none;margin-top:2px}
.kv>div{display:flex;flex-direction:column;padding:8px 0;border-bottom:1px solid var(--bd)}.kv>div:last-child{border:0}.kv span{color:var(--mu);font-size:.9em}
.steps{margin:4px 0 0;padding-left:20px}.steps li{margin:6px 0}
.about{align-items:center;text-align:center}.ab1{font-size:1.4em}.bylab{margin-top:10px;font-size:.73em;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}.byname{font-size:1.6em;font-weight:800;background:linear-gradient(90deg,var(--ac),#d4a017);-webkit-background-clip:text;background-clip:text;color:transparent}
.call{display:flex;align-items:center;gap:4px;font-size:.88em;text-decoration:none;white-space:nowrap}
.tx{color:var(--tx)!important}.big{font-size:1.5em!important;font-variant-numeric:tabular-nums}.cd{font-variant-numeric:tabular-nums}
.dz{border-left:4px solid var(--ac)}.dzt{font-size:1.2em!important}.dzs{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}.dzi{width:30px;height:30px;border-radius:9px;background:var(--as);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}.dzs ol,.dzs ul{margin:4px 0 0;padding-left:18px}.dzs span{color:var(--mu);display:block;margin-top:2px}.dzs li{margin:3px 0}.src{color:var(--mu);display:block;margin-top:8px}
.inner[data-tool] input,.inner[data-tool] select{margin:4px 0}.inner[data-tool] .res{background:var(--as);color:var(--tx);margin-top:8px}.inner[data-tool] .res span{color:var(--mu)}
/* exam hero */
.exh{background:linear-gradient(135deg,#1b3a4b,#1f5a4a);color:#f6fbf8;border:0;position:relative;overflow:hidden;padding:18px 16px}
.exh>*{position:relative}
.exh b,.exh span,.exh small,.exh h3,.exh div{color:#f6fbf8!important}
.exh .k{font-size:.78em;letter-spacing:.1em;text-transform:uppercase;font-weight:800;display:flex;align-items:center;gap:6px;color:#ffe6a8!important}
.exh h3{margin:2px 0 10px;font-size:1.3em;font-weight:800}
.cdb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.cdb div{background:rgba(0,0,0,.28);border-radius:14px;padding:10px 2px 8px;text-align:center}
.cdb b{display:block;font-size:1.7em;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:800}
.cdb small{font-size:.72em!important;text-transform:uppercase;letter-spacing:.08em;color:#cfe3da!important}
.exh .bar{background:rgba(0,0,0,.3);height:8px}.exh .bar i{background:#ffd98a}
.exh .ex2{display:flex;justify-content:space-between;font-size:.86em;gap:8px;flex-wrap:wrap}
.exh .ex2 span{color:#e3f0ea!important}
.exh .msg{font-size:.95em;margin-top:8px;color:#fff1cc!important;font-weight:600}
/* score card */
.score{background:linear-gradient(135deg,var(--cd),var(--as))}
.sc1{display:flex;gap:12px;align-items:center}
.lvl{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;box-shadow:0 5px 12px -4px var(--g1)}
.xpn{font-size:1.6em;font-weight:900;font-variant-numeric:tabular-nums;color:var(--tx)}
.fl2{display:inline-block;animation:fl 1.6s infinite alternate;transform-origin:50% 90%}
@keyframes fl{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.12) rotate(3deg)}}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.wk div{text-align:center;font-size:.7em;color:var(--mu)}
.wk i{display:flex;width:26px;height:26px;margin:2px auto 0;border-radius:50%;background:var(--bd);align-items:center;justify-content:center;font-style:normal;font-size:13px}
.wk i.on{background:linear-gradient(145deg,#f4b24a,#e07b39)}
.wk i.td{outline:2px solid var(--ac)}
/* quotes */
.qc{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--cd),var(--cd2))}
.qc::before{content:"“";position:absolute;right:10px;top:-14px;font-size:90px;color:var(--ac);opacity:.14;font-family:Georgia,serif}
.qc .qt{font-size:1.05em;font-style:italic;color:var(--tx)!important;line-height:1.5}
.qc .qh{font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ac)!important}
.lm{background:linear-gradient(135deg,var(--as),var(--cd))}
/* toast */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-140%);width:min(92vw,600px);z-index:50;transition:transform .5s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
#toast.on{transform:translate(-50%,0);pointer-events:auto}
#toast .tb{display:flex;gap:12px;align-items:flex-start;background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
#toast .te{font-size:28px;line-height:1}#toast b{display:block;font-size:.98em}#toast span{color:var(--mu);font-size:.88em}
#toast button{margin-left:auto;background:none;border:0;color:var(--mu);font-size:20px;line-height:1}
#warm{position:fixed;inset:0;pointer-events:none;z-index:60;background:rgb(255,150,40);mix-blend-mode:multiply;opacity:0;transition:opacity .4s}
/* offline */
.offl{background:#f3e0c9;border:1px solid #d7a86a;color:#4d3112;flex-direction:row!important;align-items:center;gap:12px}
.offl span,.offl small{color:#6b4818!important}.offl b{color:#4d3112}
.offl .oi{font-size:24px}
.nwp{font-size:.7em;font-weight:800;padding:3px 9px;border-radius:10px;background:#c9484a;color:#fff;margin-right:6px}
/* block posting */
.blk{background:linear-gradient(135deg,#17343b,#1f5648);color:#f6fbf8;border:0;position:relative;overflow:hidden}
.blk b,.blk span,.blk em,.blk div{color:#f6fbf8!important}
.blk small{color:#d3e6dd!important}
.blk .bk{font-size:.78em;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#ffe6a8!important}
.blk .bar{background:rgba(0,0,0,.3);height:8px}.blk .bar i{background:#ffd98a}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tl div{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.26);border-radius:14px;padding:10px 12px}
.tl div.nw{background:rgba(255,255,255,.2);outline:2px solid #ffd98a}
.tl em{font-style:normal;font-size:22px}.tl b{font-size:1.02em;display:block}
.tl small{display:block;font-size:.84em;margin-top:1px}
.tl .tt2{margin-left:auto;font-size:.86em;white-space:nowrap;font-weight:700;color:#ffe6a8!important;text-align:right}
/* directory */
.pf{display:flex;flex-direction:column;gap:6px}
.pf .ph{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;color:var(--on);font-weight:900;font-size:1.25em;flex:none}
.pf .qq{font-style:italic;color:var(--tx)!important;background:var(--as);border-radius:12px;padding:8px 10px;font-size:.92em}
.pf .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:.85em;padding:7px 12px;border-radius:12px;background:var(--as);color:var(--ac);border:1px solid var(--bd);font-family:inherit}
.rid{font-weight:800;color:var(--ac)}
/* opd */
.op h4{margin:10px 0 3px;font-size:.88em;display:flex;gap:6px;align-items:center}
.op ul{margin:2px 0 0;padding-left:18px}.op li{margin:3px 0}
.op .rf{background:rgba(201,72,74,.09);border-radius:12px;padding:6px 10px 8px}
.op .rf h4{color:#b23a3c}
.op .dis{font-size:.78em;color:var(--mu);margin-top:8px}
.tabs{display:flex;gap:8px;margin:6px 0 2px}
.tabs .chip{flex:1;text-align:center}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){.lv,.fl2{animation:none}.fade>*{animation:none}}
:root[data-rm="1"] .lv,:root[data-rm="1"] .fl2{animation:none}:root[data-rm="1"] .fade>*{animation:none}
:root[data-den="1"]{--pad:9px;--rad:14px}

.lockc{border-style:dashed}.lockc .st{filter:grayscale(.5);opacity:.85}

const DZ2=[
{n:'Community-acquired pneumonia (adult)',e:'🫁',s:'Respiratory medicine',c:['Streptococcus pneumoniae, the commonest cause','Atypical organisms such as Mycoplasma and Legionella','Viruses, including influenza'],h:['Fever, cough with purulent sputum and pleuritic chest pain','Tachypnoea, bronchial breathing and coarse crackles','Consolidation on the chest X-ray'],i:'Chest X-ray, CBC, CRP, urea, oxygen saturation. Sputum and blood cultures in moderate to severe disease. Use CURB-65 to decide on admission.',t:'Oxygen if needed, fluids and an early antibiotic. Low severity: oral amoxicillin for 5 days. Moderate or severe: add a macrolide and admit.',d:'Amoxicillin (add clarithromycin or azithromycin for atypical cover). Severe disease: a beta-lactam such as ceftriaxone plus a macrolide.',a:'Stop smoking, vaccinate against influenza and pneumococcus, and review after 6 weeks, with a repeat X-ray for smokers over 50.',r:'BTS and NICE pneumonia guidance'},
{n:'COPD exacerbation',e:'🚬',s:'Respiratory medicine',c:['Smoking and biomass-fuel smoke','Chronic bronchitis and emphysema','Triggers: infections and air pollution'],h:['Increased breathlessness, cough and sputum purulence','Barrel chest, pursed-lip breathing, wheeze','Hyperinflation on X-ray and obstruction on spirometry (FEV1/FVC below 0.7)'],i:'Spirometry for diagnosis. In an attack: oxygen saturation, arterial blood gas, chest X-ray, CBC.',t:'Controlled oxygen (target 88 to 92%), bronchodilators, steroids and antibiotics if sputum is purulent. Non-invasive ventilation for acidotic respiratory failure.',d:'Nebulised salbutamol and ipratropium, prednisolone 30 to 40 mg for 5 days, and an antibiotic such as amoxicillin or doxycycline.',a:'Stop smoking, give vaccines, teach inhaler technique, and offer pulmonary rehabilitation.',r:'GOLD and NICE COPD guidance'},
{n:'Acute appendicitis',e:'🩹',s:'Surgery',c:['Luminal obstruction by faecolith or lymphoid hyperplasia','Peak age: 10 to 30 years','Delay can lead to perforation and peritonitis'],h:['Central abdominal pain moving to the right iliac fossa','Anorexia, nausea and low-grade fever','Tenderness and guarding at McBurney’s point, positive Rovsing sign'],i:'Clinical diagnosis supported by CBC and CRP. Ultrasound in children and women, CT when unclear. Pregnancy test in women.',t:'Appendicectomy after fluids and antibiotics. Open or laparoscopic.',d:'Intravenous antibiotics such as ceftriaxone with metronidazole around surgery.',a:'Seek care early for right lower abdominal pain with fever or vomiting. Do not take laxatives.',r:'WSES Jerusalem guidelines; standard surgical texts'},
{n:'Cirrhosis with ascites',e:'🍷',s:'Gastroenterology',c:['Chronic hepatitis B or C','Alcohol-related liver disease and fatty liver','Autoimmune disease and haemochromatosis'],h:['Ascites, spider naevi, palmar erythema and jaundice','Splenomegaly with portal hypertension','Low albumin, prolonged INR and low platelets'],i:'Liver function, INR, ultrasound, endoscopy for varices, and diagnostic ascitic tap (SAAG, cell count, culture).',t:'Salt restriction, diuretics and treatment of the cause. Large-volume paracentesis with albumin for tense ascites. Prevent complications.',d:'Spironolactone with furosemide. Beta-blocker or band ligation for varices. Antibiotic prophylaxis after SBP.',a:'Avoid alcohol and NSAIDs, vaccinate against hepatitis A and B, screen for hepatocellular carcinoma every 6 months.',r:'EASL and AASLD guidance'},
{n:'Chronic kidney disease',e:'🫘',s:'Nephrology',c:['Diabetes mellitus and hypertension','Glomerulonephritis and obstructive uropathy','Polycystic kidney disease and chronic NSAID use'],h:['Often silent until late: fatigue, pruritus, nausea','Oedema, hypertension, anaemia, bone disease','eGFR below 60 mL/min or albuminuria for 3 months or more'],i:'Serum creatinine and eGFR, urine albumin-creatinine ratio, urine R/E, kidney ultrasound, CBC, calcium, phosphate, PTH.',t:'Treat the cause, control BP and glucose, reduce proteinuria, and prepare for dialysis or transplant when needed.',d:'ACE inhibitor or ARB for proteinuria, SGLT2 inhibitor, statin. Avoid NSAIDs and nephrotoxic drugs, adjust doses.',a:'Eat a low-salt diet, stay hydrated unless advised otherwise, and check kidney function yearly in diabetes and hypertension.',r:'KDIGO 2024'},
{n:'Hypothyroidism',e:'🦋',s:'Endocrinology',c:['Autoimmune (Hashimoto) thyroiditis, the commonest cause','Iodine deficiency worldwide','After thyroidectomy, radioiodine or neck radiotherapy'],h:['Tiredness, weight gain, cold intolerance, constipation','Dry skin, bradycardia, slow-relaxing reflexes','Raised TSH with low free T4'],i:'TSH and free T4. Anti-TPO antibodies if the cause is unclear.',t:'Lifelong thyroid hormone replacement, monitored with TSH.',d:'Levothyroxine 1.6 microgram/kg a day for most adults. Start lower in the elderly and in heart disease. Take on an empty stomach.',a:'Recheck TSH 6 to 8 weeks after any dose change, and annually when stable.',r:'ATA and NICE thyroid guidance'},
{n:'Status epilepticus',e:'⚡',s:'Neurology',c:['Poor antiepileptic drug adherence or sudden withdrawal','Stroke, infection, tumour, head injury','Metabolic: hypoglycaemia, hyponatraemia, alcohol withdrawal'],h:['Continuous seizure for 5 minutes or more, or repeated seizures without recovery','Altered consciousness','Risk of hypoxia and brain injury'],i:'Check blood glucose at once. Electrolytes, calcium, drug levels, CT or MRI, EEG when needed.',t:'ABC, oxygen and a safe position. Stop the seizure quickly with a benzodiazepine, then a second-line drug.',d:'Intravenous lorazepam 4 mg (or diazepam, or intramuscular midazolam if no IV access). Second line: levetiracetam, phenytoin or sodium valproate.',a:'Never stop antiepileptic drugs suddenly. Avoid swimming or climbing alone, and tell a family member what to do during a seizure.',r:'NICE epilepsy guideline; ILAE'},
{n:'Bacterial meningitis',e:'🧠',s:'Infectious disease',c:['Streptococcus pneumoniae and Neisseria meningitidis in adults','Haemophilus influenzae type b and group B Streptococcus in children and neonates','Listeria in the elderly and pregnancy'],h:['Fever, severe headache, neck stiffness and photophobia','Altered consciousness, seizures','Non-blanching purpuric rash in meningococcal disease'],i:'Blood cultures first. Lumbar puncture if safe (cell count, glucose, protein, Gram stain, culture). CT head first if focal signs or reduced consciousness.',t:'Do not delay antibiotics. Start empirical treatment immediately, and add dexamethasone.',d:'Ceftriaxone 2 g intravenously twice a day (add ampicillin for those over 50 or in pregnancy). Dexamethasone 10 mg four times a day for 4 days, started with or just before the first antibiotic dose.',a:'Close contacts of meningococcal cases need chemoprophylaxis. Vaccination against Hib, pneumococcus and meningococcus protects.',r:'NICE meningitis and ESCMID guidance'},
{n:'Acute rheumatic fever',e:'🫀',s:'Cardiology',c:['Immune reaction after group A streptococcal pharyngitis','Common in children aged 5 to 15 in low-income settings','Leading cause of rheumatic heart disease'],h:['Fever with migratory polyarthritis','Carditis, Sydenham chorea, erythema marginatum, subcutaneous nodules','Evidence of preceding strep infection (raised ASO titre)'],i:'Revised Jones criteria with ASO or anti-DNase B, ECG and echocardiography.',t:'Bed rest, eradicate streptococci, treat inflammation, and give long-term secondary prophylaxis.',d:'Benzathine penicillin G 1.2 million units intramuscularly every 3 to 4 weeks for secondary prophylaxis. Aspirin or naproxen for arthritis. Steroids for severe carditis.',a:'Treat every sore throat in a child properly and keep prophylaxis going for years (duration depends on carditis).',r:'AHA 2015 and WHO'},
{n:'Acute poststreptococcal glomerulonephritis',e:'🧪',s:'Nephrology',c:['Nephritogenic group A streptococci after pharyngitis or skin infection','Immune complex deposition in the glomeruli','Usually children aged 5 to 12'],h:['Haematuria (cola-coloured urine), oedema and hypertension','Oliguria, mild proteinuria','Low C3 and raised ASO titre'],i:'Urine R/E (red cell casts), creatinine, C3, ASO titre, BP and weight monitoring.',t:'Supportive: salt and fluid restriction, diuretics and antihypertensives. Antibiotic only for active infection.',d:'Furosemide for oedema and hypertension. Antihypertensive such as amlodipine if needed.',a:'Most children recover fully. Check BP and urine until normal, and review C3 at 8 to 12 weeks.',r:'KDIGO glomerular disease guideline'},
{n:'Nephrotic syndrome in children',e:'🧸',s:'Paediatrics',c:['Minimal change disease in most children aged 1 to 10','Primary focal segmental glomerulosclerosis','Secondary causes less common'],h:['Heavy proteinuria, hypoalbuminaemia, oedema and hyperlipidaemia','Periorbital puffiness in the morning, ascites','No haematuria or hypertension in typical cases'],i:'Urine protein (dipstick, protein-creatinine ratio), serum albumin, lipids, creatinine. Biopsy only for atypical features.',t:'Prednisolone for 12 weeks or more, with salt restriction and treatment of infection. Watch for relapses.',d:'Prednisolone 60 mg/m² a day (maximum 60 mg) for 4 to 6 weeks, then alternate days with tapering.',a:'Check urine at home each morning, avoid live vaccines on high-dose steroids, and call the doctor for fever or pain.',r:'KDIGO and IPNA guidance'},
{n:'Hypoglycaemia',e:'🍯',s:'Endocrinology',c:['Insulin or sulfonylurea overdose in diabetes','Missed meals, alcohol, exercise','Sepsis, liver or adrenal failure, insulinoma'],h:['Sweating, tremor, palpitations and hunger','Confusion, drowsiness, seizures, coma','Whipple triad: low glucose, symptoms, relief by glucose'],i:'Capillary blood glucose at once (below 4 mmol/L, 70 mg/dL). Find the cause.',t:'Treat promptly. Conscious: fast-acting oral carbohydrate. Unconscious: intravenous glucose or intramuscular glucagon.',d:'15 to 20 g of oral glucose, repeat after 15 minutes if needed. Intravenous 10% glucose 150 to 200 mL, or glucagon 1 mg intramuscularly if no access.',a:'Always carry a sugar source, never skip meals on insulin, and teach family members how to help.',r:'ADA and Diabetes UK'}

{n:'Dengue fever',e:'🦟',s:'Infectious disease',c:['Dengue virus (serotypes 1 to 4)','Bite of an infected Aedes mosquito','A second infection with a different serotype raises the risk of severe disease'],h:['Acute fever with severe headache and pain behind the eyes','Falling platelets with a rising haematocrit as plasma leaks (critical phase)','Warning signs: abdominal pain, persistent vomiting, mucosal bleeding'],i:'Days 1 to 5: NS1 antigen or RT-PCR. After day 5: dengue IgM. Follow platelet count and haematocrit daily.',t:'Supportive care: oral fluids, close monitoring, and intravenous isotonic fluids only for warning signs or shock.',d:'There is no antiviral drug. Use paracetamol for fever. Avoid NSAIDs and aspirin because of the bleeding risk.',a:'Return urgently for bleeding, persistent vomiting, severe abdominal pain, drowsiness or cold hands and feet. Remove stagnant water to stop Aedes breeding.',r:'WHO dengue guidelines (2009) and DGHS Bangladesh'},
{n:'Enteric (typhoid) fever',e:'🌡️',s:'Infectious disease',c:['Salmonella Typhi or Paratyphi A','Faeco-oral spread through contaminated food or water','Chronic carriers, mainly through the gallbladder'],h:['Sustained fever for more than 5 to 7 days','Relative bradycardia','Rose spots on the trunk (in a minority of patients)'],i:'Blood culture. Bone marrow culture is more sensitive but is rarely needed. The Widal test is unreliable.',t:'Antibiotics chosen by local resistance patterns, plus fluids and nutrition. Surgery is needed for intestinal perforation.',d:'In Bangladesh, azithromycin for uncomplicated disease and ceftriaxone for severe disease, because fluoroquinolone resistance is widespread.',a:'Drink safe water, wash hands, and take the typhoid conjugate vaccine where available. Carriers must not handle food.',r:'WHO and national antimicrobial guidance'},
{n:'Pulmonary tuberculosis',e:'🦠',s:'Infectious disease',c:['Mycobacterium tuberculosis','Airborne spread from an infectious case','Risk factors: HIV, diabetes, malnutrition, smoking and close contact'],h:['Cough for 2 weeks or more','Haemoptysis, night sweats and weight loss','Upper-lobe cavitation on the chest X-ray'],i:'Xpert MTB/RIF (Ultra) on sputum. It confirms TB and checks for rifampicin resistance.',t:'2 months of isoniazid, rifampicin, pyrazinamide and ethambutol (HRZE), then 4 months of isoniazid and rifampicin (HR).',d:'Fixed-dose combination tablets under directly observed treatment (DOT), as used by the Bangladesh National TB Programme.',a:'Finish the full course. Screen household contacts. Test for HIV and diabetes. Cover the mouth when coughing.',r:'WHO consolidated TB guidelines and Bangladesh NTP'},

{n:'Kala-azar (visceral leishmaniasis)',e:'🦠',s:'Infectious disease',c:['Leishmania donovani','Bite of the sandfly Phlebotomus argentipes','Humans are the main reservoir, including patients with post kala-azar dermal leishmaniasis'],h:['Fever for more than 2 weeks','Massive splenomegaly','Weight loss and pancytopenia'],i:'rK39 rapid test with a compatible illness. A splenic or bone marrow aspirate showing amastigotes confirms the diagnosis.',t:'Single-dose liposomal amphotericin B.',d:'Liposomal amphotericin B 10 mg/kg as a single intravenous dose, the first-line regimen of the South Asian elimination programme, including Bangladesh.',a:'Follow up for skin lesions (PKDL). Support vector control with indoor residual spraying.',r:'WHO South-East Asia Region guidance'},
{n:'Dog bite and rabies prevention',e:'🐕',s:'Infectious disease',c:['Rabies virus (a lyssavirus)','Bite, scratch or lick on broken skin from a rabid animal, mostly dogs','The disease is almost always fatal once symptoms begin'],h:['Hydrophobia and aerophobia','Agitation and excess salivation','Ascending paralysis in the paralytic form'],i:'Rabies is diagnosed clinically in humans. Saliva PCR or a skin biopsy can confirm it, but prevention must never wait.',t:'Wash the wound with soap and running water for 15 minutes, then start post-exposure prophylaxis at once.',d:'Rabies vaccine (intradermal or intramuscular schedule), plus rabies immunoglobulin infiltrated into and around the wound for category III exposure.',a:'Do not suture the wound or apply chilli, lime or herbs. Start vaccination on the same day. Vaccinate pets.',r:'WHO rabies position paper (2018)'},
{n:'Snake bite',e:'🐍',s:'Emergency medicine',c:['Elapids such as cobra and krait','Vipers such as Russell’s viper','Rural exposure: farming, walking barefoot and sleeping on the floor'],h:['Ptosis, then ophthalmoplegia and respiratory paralysis (neurotoxic)','Local swelling, bleeding and incoagulable blood (haemotoxic)','A positive 20-minute whole blood clotting test'],i:'The 20-minute whole blood clotting test (20WBCT) at the bedside.',t:'Keep the limb still, transfer to hospital quickly, give specific antivenom, and support the airway and breathing.',d:'Polyvalent antivenom. In neurotoxic bites, a trial of neostigmine with atropine may help.',a:'Do not cut, suck, apply a tight tourniquet or use herbs. Go to hospital immediately.',r:'WHO South-East Asia snake bite guideline (2016)'},
{n:'ST-elevation myocardial infarction',e:'❤️',s:'Cardiology',c:['Rupture or erosion of an atherosclerotic plaque with coronary thrombosis','Risk factors: smoking, hypertension, diabetes and dyslipidaemia','Less often: coronary spasm, dissection or embolism'],h:['Central crushing chest pain for 20 minutes or more, with sweating','ST elevation in 2 contiguous leads on the ECG','Pain spreading to the left arm or jaw'],i:'A 12-lead ECG within 10 minutes of arrival. Troponin confirms injury but must not delay treatment.',t:'Primary PCI within 120 minutes of first contact. If this is not possible, give fibrinolysis, then transfer.',d:'Aspirin and a P2Y12 inhibitor, plus an anticoagulant. Where PCI is not available, as in many centres in Bangladesh, use streptokinase or tenecteplase.',a:'Call for help early. After discharge: high-intensity statin, beta-blocker, ACE inhibitor, stopping smoking and cardiac rehabilitation.',r:'ESC acute coronary syndromes guidelines (2023)'},
{n:'Heart failure with reduced ejection fraction',e:'💓',s:'Cardiology',c:['Ischaemic heart disease','Hypertension','Valvular heart disease and cardiomyopathy'],h:['Breathlessness on exertion, orthopnoea and paroxysmal nocturnal dyspnoea','Raised jugular venous pressure and basal crackles','Peripheral oedema and a third heart sound'],i:'Echocardiography (LVEF 40% or less), with NT-proBNP when heart failure is suspected.',t:'The four pillars: ARNI or ACE inhibitor (or ARB), beta-blocker, mineralocorticoid receptor antagonist and SGLT2 inhibitor. Add a loop diuretic for congestion.',d:'Examples: ramipril or enalapril, bisoprolol or carvedilol, spironolactone, dapagliflozin or empagliflozin.',a:'Weigh yourself daily, avoid excess salt, take medicines every day, get vaccinated, and attend regular follow-up.',r:'ESC heart failure guidelines (2021)'},
{n:'Hypertension',e:'🩺',s:'Cardiology',c:['Essential (primary) hypertension, in most adults','Renal parenchymal or renovascular disease','Endocrine causes: primary aldosteronism, phaeochromocytoma, Cushing syndrome'],h:['Usually no symptoms','Clinic BP of 140/90 mmHg or more on repeated measurement','Target-organ damage: retinopathy, left ventricular hypertrophy, proteinuria'],i:'Repeated clinic BP, confirmed by home or ambulatory BP monitoring.',t:'Lifestyle changes plus drugs. Most patients start with a two-drug single-pill combination.',d:'An ACE inhibitor or ARB combined with a calcium channel blocker or a thiazide-like diuretic.',a:'Reduce salt, stop smoking, exercise, control weight, check BP regularly and aim for below 130/80 mmHg if tolerated.',r:'ESC/ESH hypertension guidelines'},
{n:'Type 2 diabetes mellitus',e:'🍬',s:'Endocrinology',c:['Insulin resistance with relative insulin deficiency','Obesity, especially central obesity','Family history, ageing and a sedentary lifestyle'],h:['Polyuria, polydipsia and weight loss','Fasting plasma glucose of 7.0 mmol/L (126 mg/dL) or more','HbA1c of 6.5% or more'],i:'Fasting plasma glucose, HbA1c or a 2-hour OGTT. Confirm with a second test if there are no clear symptoms.',t:'Lifestyle change plus metformin. Add an SGLT2 inhibitor or a GLP-1 receptor agonist for heart failure, CKD or high cardiovascular risk.',d:'Metformin, if the eGFR is 30 or more.',a:'Check the feet at every visit. Screen the eyes and kidneys every year. Control BP and lipids.',r:'ADA Standards of Care and WHO'},
{n:'Diabetic ketoacidosis',e:'🧪',s:'Endocrinology',c:['Missed insulin, or new-onset type 1 diabetes','Infection','Other acute illness, or SGLT2 inhibitor use'],h:['Kussmaul breathing and a fruity breath','Dehydration and abdominal pain','High glucose with ketones and acidosis'],i:'Blood ketones (beta-hydroxybutyrate 3 mmol/L or more) with a venous blood gas showing acidosis (pH below 7.3).',t:'Intravenous 0.9% saline first, then a fixed-rate insulin infusion with potassium replacement. Find and treat the trigger.',d:'Soluble (regular) insulin 0.1 units/kg/hour by infusion, after fluids have started and the potassium is known.',a:'Sick-day rules: never stop basal insulin, check ketones when unwell and seek help early.',r:'JBDS and the ADA/EASD consensus report'},
{n:'Bronchial asthma',e:'🌬️',s:'Respiratory medicine',c:['Allergens such as house dust mite and pollen','Viral respiratory infections','Smoke, pollution, cold air, exercise and, in some, aspirin'],h:['Recurrent wheeze, cough and breathlessness','Symptoms worse at night or early in the morning','Variable, reversible airflow obstruction'],i:'Spirometry showing reversible obstruction: FEV1 rises by 12% and 200 mL or more after a bronchodilator.',t:'Stepwise treatment built on an inhaled corticosteroid.',d:'GINA prefers as-needed low-dose ICS-formoterol as the reliever. Where it is not available, use salbutamol as needed with a regular inhaled corticosteroid.',a:'Check the inhaler technique, avoid triggers, use a written action plan and have the annual influenza vaccine.',r:'GINA report'},
{n:'Peptic ulcer disease',e:'🍽️',s:'Gastroenterology',c:['Helicobacter pylori infection','NSAIDs and aspirin','Smoking, and rarely Zollinger-Ellison syndrome'],h:['Epigastric pain related to meals','Haematemesis or melaena as a complication','Alarm features: weight loss, dysphagia, anaemia or persistent vomiting'],i:'Upper GI endoscopy, with biopsy for H. pylori and for gastric ulcers. Use a breath or stool antigen test when endoscopy is not needed.',t:'Stop NSAIDs, eradicate H. pylori and give a proton pump inhibitor.',d:'Bismuth quadruple therapy for 14 days is preferred when clarithromycin resistance is high or unknown. Clarithromycin triple therapy only where local resistance is below 15%.',a:'Confirm eradication with a breath or stool antigen test. Avoid NSAIDs and stop smoking.',r:'Maastricht VI and ACG guidelines'},
{n:'Acute ischaemic stroke',e:'🧠',s:'Neurology',c:['Large-artery atherosclerosis','Cardioembolism, especially atrial fibrillation','Small-vessel (lacunar) disease'],h:['Sudden facial droop, arm weakness or speech disturbance','Sudden loss of vision or of part of the visual field','Sudden vertigo with unsteadiness (posterior circulation)'],i:'Urgent non-contrast CT of the brain to exclude haemorrhage. MRI is more sensitive when available.',t:'Intravenous thrombolysis within 4.5 hours of onset if eligible, and thrombectomy for large-vessel occlusion where available.',d:'Alteplase 0.9 mg/kg (maximum 90 mg): 10% as a bolus and the rest over 60 minutes. Give aspirin once haemorrhage is excluded, and delay it for 24 hours after thrombolysis.',a:'Time is brain: go to hospital at once. Long term: antiplatelet, statin, BP control, an anticoagulant for atrial fibrillation, and stopping smoking.',r:'AHA/ASA and ESO stroke guidelines'},
{n:'Pneumonia in children',e:'🧒',s:'Paediatrics',c:['Streptococcus pneumoniae','Haemophilus influenzae type b','Respiratory viruses such as RSV'],h:['Fast breathing for age','Lower chest wall indrawing','Danger signs: unable to drink, convulsions, central cyanosis'],i:'Clinical diagnosis from fast breathing and chest indrawing. A chest X-ray is not routinely needed. Use pulse oximetry to find hypoxaemia.',t:'Oral amoxicillin for fast-breathing pneumonia and for chest indrawing. Severe pneumonia needs injectable antibiotics and oxygen.',d:'Amoxicillin 40 mg/kg per dose twice daily: 3 days for fast breathing, 5 days for chest indrawing. For severe pneumonia, use injectable ampicillin with gentamicin.',a:'Continue breastfeeding and fluids. Return if breathing worsens. Complete Hib, pneumococcal and measles vaccination.',r:'WHO revised pneumonia guidelines (2014) and IMCI'},
{n:'Pre-eclampsia',e:'🤰',s:'Obstetrics',c:['Abnormal placentation with endothelial dysfunction','Risk factors: first pregnancy, previous pre-eclampsia, chronic hypertension, diabetes, multiple pregnancy','Obesity and age over 40'],h:['New hypertension (140/90 mmHg or more) after 20 weeks','Proteinuria or other organ dysfunction','Severe features: headache, visual disturbance, epigastric pain, clonus'],i:'Blood pressure and urine protein, with blood tests for platelets, liver enzymes and creatinine.',t:'Delivery of the placenta is the definitive treatment. The timing depends on gestation and severity. Control BP and prevent seizures.',d:'Magnesium sulphate to prevent and treat eclamptic seizures. Labetalol, nifedipine or hydralazine for severe hypertension.',a:'Prevention: low-dose aspirin from 12 weeks for women at high risk, and calcium supplements where intake is low. Attend every antenatal visit.',r:'WHO, NICE and ACOG guidance'},
{n:'Postpartum haemorrhage',e:'🩸',s:'Obstetrics',c:['Tone: uterine atony, the most common cause','Trauma: genital tract tears or uterine rupture','Tissue (retained placenta) and Thrombin (coagulopathy)'],h:['Blood loss of 500 mL or more within 24 hours of birth','A soft uterus that does not contract','Signs of shock: tachycardia, low BP, pallor'],i:'Bedside assessment of the 4 Ts. Measure blood loss, check uterine tone and the placenta, and send haemoglobin, clotting tests and a cross-match.',t:'Call for help, rub up the uterus, give uterotonics and tranexamic acid, treat the cause, and escalate to balloon tamponade or surgery.',d:'Oxytocin is first-line. Give tranexamic acid 1 g IV within 3 hours of birth. Ergometrine, carboprost or misoprostol are second-line.',a:'Active management of the third stage for every birth, delivery with a skilled attendant, and treatment of anaemia in pregnancy.',r:'WHO recommendations for PPH (2017)'},

const Calc={
 bmi(kg,cm){const m=cm/100,b=kg/(m*m);return{b,who:b<18.5?'Underweight':b<25?'Normal weight':b<30?'Overweight':b<35?'Obese class I':b<40?'Obese class II':'Obese class III',asia:b<18.5?'Underweight':b<23?'Normal weight':b<27.5?'Overweight (increased risk)':'Obese (high risk)'}},
 gcs(e,v,m){const t=e+v+m;return{t,sev:t>=13?'Mild':t>=9?'Moderate':'Severe'}},
 curb(c,u,r,b,a){const s=[c,u,r,b,a].filter(Boolean).length;return{s,txt:s<=1?'Low risk. Home treatment can be considered.':s==2?'Moderate risk. Consider a short hospital stay or hospital-supervised outpatient care.':s==3?'High risk. Admit to hospital.':'Very high risk. Admit, and consider intensive care.'}},
 wellsPE(f){const w=[3,3,1.5,1.5,1.5,1,1];let s=0;f.forEach((x,i)=>{if(x)s+=w[i]});return{s,three:s<2?'Low':s<=6?'Moderate':'High',two:s>4?'PE likely':'PE unlikely'}},
 wellsDVT(f){const w=[1,1,1,1,1,1,1,1,1,-2];let s=0;f.forEach((x,i)=>{if(x)s+=w[i]});return{s,three:s<=0?'Low':s<=2?'Moderate':'High',two:s>=2?'DVT likely':'DVT unlikely'}},
 egfr(scr,age,sex){const k=sex=='f'?0.7:0.9,a=sex=='f'?-0.241:-0.302,e=142*Math.pow(Math.min(scr/k,1),a)*Math.pow(Math.max(scr/k,1),-1.2)*Math.pow(0.9938,age)*(sex=='f'?1.012:1);return{e,stage:e>=90?'G1 (normal or high)':e>=60?'G2 (mildly decreased)':e>=45?'G3a (mildly to moderately decreased)':e>=30?'G3b (moderately to severely decreased)':e>=15?'G4 (severely decreased)':'G5 (kidney failure)'}},
 corrCa(ca,alb,sm){const c=sm?ca+0.02*(40-alb):ca+0.8*(4-alb),lo=sm?2.2:8.8,hi=sm?2.6:10.4;return{c,flag:c<lo?'Low':c>hi?'High':'Within the reference range'}},
 ag(na,cl,hco3,alb){const a=na-(cl+hco3),r={a,flag:a>12?'Raised (above about 12)':a<8?'Low (below about 8)':'Within the usual range (about 8 to 12)'};if(alb!=null&&!isNaN(alb))r.c=a+2.5*(4.4-alb);return r}};
const num=id=>{const v=parseFloat(($('#'+id)||{}).value);return isNaN(v)?null:v},chk=id=>!!($('#'+id)||{}).checked,sel=id=>+(($('#'+id)||{}).value||0);

 if(k=='gcs'){const r=Calc.gcs(sel('ge'),sel('gv'),sel('gm'));h=`<b>GCS ${r.t} (E${sel('ge')} V${sel('gv')} M${sel('gm')})</b><span>${r.sev} head injury range</span>`}

 if(k=='egfr'){let s=num('es');const a=num('ea'),u=($('#eu')||{}).value;if(s>0&&a>0){if(u=='umol')s=s/88.4;const r=Calc.egfr(s,a,($('#ex')||{}).value);h=`<b>eGFR ${Math.round(r.e)} mL/min/1.73 m²</b><span>CKD stage: ${r.stage}</span><span>CKD-EPI 2021 creatinine equation</span>`}}

 o.innerHTML=h||'<span>Enter the values above.</span>'}

 +tl('wpe','Wells score for pulmonary embolism',`${cb('p0','Clinical signs of DVT (3)')}${cb('p1','PE is the most likely diagnosis (3)')}${cb('p2','Heart rate above 100 (1.5)')}${cb('p3','Immobilisation for 3 days or more, or surgery in the last 4 weeks (1.5)')}${cb('p4','Previous PE or DVT (1.5)')}${cb('p5','Haemoptysis (1)')}${cb('p6','Active cancer (1)')}<div class=res id=o_wpe></div>`)

 +det('nv2','Paediatric vital signs (APLS ranges)',`<div class=kv>${PAE.map(x=>`<div><b>${x[0]}</b><span>HR ${x[1]} · RR ${x[2]} · SBP ${x[3]}</span></div>`).join('')}</div>`)

const rmOn=k=>ls('rm_'+k)!='0',rmT=(k,d)=>ls('rt_'+k)||d;
let pk='';
const hs=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h};
function push(){const g0=g;try{const B=window.AndroidBridge;const hg=ls('g')||g;if(!B||!hg)return;g=hg;const k=hg+'|'+ls('r')+'|'+firstName()+'|'+hs(JSON.stringify(st.days||{}))+'|'+hs(ls('plan')||'')+rmOn('pl')+'|'+st.sgt+'|'+(ls('lead')||'')+'|'+today().getTime()+'|'+['cl','mo','ev'].map(x=>rmOn(x)+rmT(x,'')).join();if(k==pk)return;pk=k;
 const now=Date.now(),t0=today(),lead=+ls('lead')||10,nm=firstName(),L=[],hm=s=>+s.slice(0,2)*60+ +s.slice(2);
 for(let i=0;i<7;i++){const d=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+i),S=slotsFor(d).filter(s=>!/lunch|Break/.test(s.t));
  if(rmOn('cl'))S.forEach(s=>{const t=+d+s.a*6e4-lead*6e4;if(t>now&&!s.canc&&!s.done)L.push({t,h:(nm?nm+', ':'')+s.t+' in '+lead+' min',b:f12(s.a)+(s.n?' · '+s.n:'')+'\n“'+relq(s.t,'',ymd(d))+'”'})});
  if(rmOn('mo')&&S.length){const t=+d+hm(rmT('mo','0715'))*6e4;if(t>now)L.push({t,h:'Good morning'+(nm?', '+nm:'')+'!',b:S.slice(0,4).map(s=>f12(s.a)+' '+s.t+(s.canc?' (cancelled)':'')).join(' · ')+'\n“'+relq('', 'morning', ymd(d))+'”'})}
  if(rmOn('ev')){const t=+d+hm(rmT('ev','2100'))*6e4;if(t>now){const nd=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1),y=slotsFor(nd).find(x=>!/lunch|Break/.test(x.t)&&!x.canc);if(y)L.push({t,h:(nm?nm+', t':'T')+'ime for tonight’s revision',b:'Tomorrow: '+y.t+' at '+f12(y.a)+'.\n“'+relq(y.t,'',ymd(nd))+'”'});else{const q=QE[(seedN()*13+Math.floor(+d/DAY)*5)%QE.length];L.push({t,h:(nm?nm+', t':'T')+'ime for tonight’s revision',b:'“'+q[0]+'” — '+q[1]})}}}}
 if(rmOn('pl'))for(let i=0;i<7;i++){const d=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+i);planFor(d).forEach(p=>{const t=+d+p.s*6e4-lead*6e4;if(t>now&&!p.done)L.push({t,h:(nm?nm+', ':'')+p.sub+' study in '+lead+' min',b:(p.topic?p.topic+' · ':'')+f12(p.s)+' to '+f12(p.e)+(p.target?' · '+p.target:'')+'\n“'+relq(p.sub,'',ymd(d))+'”'})})}
 evs(g).forEach(e=>{const t=+e.s-4*36e5;if(t>now&&t<now+14*DAY)L.push({t,h:'Starts tomorrow',b:e.t})});
 B.set(JSON.stringify(L))}catch(e){}finally{g=g0}}
